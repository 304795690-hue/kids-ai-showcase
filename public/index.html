<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生登录 - 少儿AI作品展示平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>👋 欢迎回来</h1>
    <p class="subtitle">请登录你的账号，上传你的AI作品</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">账号</label>
        <input type="text" id="username" name="username" placeholder="例如: stu001" required>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码" required>
      </div>
      <button type="submit" class="btn btn-primary">登录</button>
    </form>

    <div class="auth-link">
      还没有账号？<a href="/register.html">立即注册 →</a>
    </div>
    <div class="auth-link" style="margin-top: 8px;">
      👨‍👩‍👧 家长浏览 → <a href="/gallery.html">公开画廊</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('studentId', data.user.id);
          localStorage.setItem('studentName', data.user.display_name);
          window.location.href = '/student/dashboard.html';
        } else {
          alert(data.message);
        }
      } catch (e) {
        alert('网络错误：' + e.message);
      }
    });
  </script>
</body>
</html>
